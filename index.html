<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handle – claim your link page</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@500;800&family=Orbitron:wght@500;800&family=Pacifico&family=Press+Start+2P&family=Bebas+Neue&family=Righteous&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050507;--ink:#f4f2ff;--muted:#9a97b8;--accent:#9b6bff;--glow:#7c3aed;--card:rgba(18,16,30,.62);--line:rgba(155,107,255,.35);--bad:#ff7a93;--ok:#5fdcaa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(60% 50% at 50% 0%,#241046 0%,var(--bg) 70%) fixed,var(--bg);color:var(--ink);font:500 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;overflow-x:hidden}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:36px 18px 60px;min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 0 40px rgba(124,58,237,.25),inset 0 0 30px rgba(155,107,255,.06)}
h1{font-weight:800;font-size:clamp(36px,10vw,56px);line-height:1;margin:0 0 10px;letter-spacing:-.03em;text-shadow:0 0 28px var(--glow)}
p.sub{color:var(--muted);margin:0 0 22px}
.handle{display:flex;align-items:center;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:14px;padding:4px 14px;gap:4px}
.handle:focus-within{border-color:var(--accent);box-shadow:0 0 22px rgba(155,107,255,.45)}
.handle span{color:var(--muted);font-weight:800;font-size:20px}
.handle b{color:var(--accent);font-weight:800;font-size:20px;white-space:nowrap}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;outline:0;width:100%}
.handle input{font-size:20px;font-weight:800;padding:12px 0}
.status{min-height:24px;margin:10px 2px 14px;font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:13px 20px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--glow));color:#fff;box-shadow:0 0 22px rgba(124,58,237,.5)}
button.ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.row .field{margin:0}
.profile{text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff5fa2);display:grid;place-items:center;font-weight:800;font-size:42px;margin:0 auto 14px;box-shadow:0 0 34px rgba(155,107,255,.65)}
.profile h2{margin:0;font-size:30px;font-weight:800;text-shadow:0 0 22px var(--glow)}
.at{color:var(--accent);font-weight:800}
.bio{color:var(--muted);margin:10px 0 6px;min-height:24px}
.bio i{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.views{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;margin:6px 0 20px}
.lnk{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-weight:800;transition:transform .15s,box-shadow .15s,border-color .15s}
.lnk em{font-style:normal;width:24px;text-align:center}
.lnk:hover{transform:scale(1.025);border-color:var(--accent);box-shadow:0 0 26px rgba(155,107,255,.5)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.center{justify-content:center}
.note{font-size:13px;color:var(--muted);margin-top:16px}
#enter{position:fixed;inset:0;z-index:5;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .6s}
#enter span{font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--ink);text-shadow:0 0 24px var(--glow);animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.glass{border-color:var(--ln);box-shadow:0 0 40px var(--gl)}
button{background:linear-gradient(135deg,var(--accent),var(--glow));box-shadow:0 0 22px var(--gl);color:var(--on,#fff)}
.avatar{background:linear-gradient(135deg,var(--accent),var(--glow));color:var(--on,#fff);box-shadow:0 0 34px var(--gl)}
.lnk{border-color:var(--ln)}.lnk:hover{border-color:var(--accent);box-shadow:0 0 26px var(--gl)}
.grp{font-size:13px;color:var(--muted);margin:16px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{padding:7px 12px;font-size:13px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--ln);box-shadow:none}
button.chip.on{background:var(--accent);color:var(--on,#000)}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.glass .nf1{text-shadow:0 0 6px #fff,0 0 18px var(--accent),0 0 42px var(--accent)}
.glass .nf2{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e0a0,#5fa8ff,#c47bff,#ff5f6d);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:sh 6s linear infinite}
.glass .nf3{background:linear-gradient(90deg,var(--accent),#fff,var(--glow));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.glass .nf4{text-shadow:2px 0 #ff2e63,-2px 0 #08f7fe;animation:gl 2.5s steps(1) infinite}
.glass .nf5{text-shadow:3px 3px 0 var(--glow),6px 6px 0 rgba(0,0,0,.5)}
.glass .nf6{color:transparent;-webkit-text-stroke:1.5px var(--ink);text-shadow:none}
.glass .nf7{animation:fk 3s infinite}
.glass .nf8{background:linear-gradient(110deg,var(--ink) 40%,var(--accent) 50%,var(--ink) 60%);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:sh 3s linear infinite}
.glass .nf9{text-shadow:none;letter-spacing:.2em;text-transform:uppercase}
@keyframes sh{to{background-position:300% 0}}
@keyframes gl{50%{text-shadow:-2px 0 #ff2e63,2px 0 #08f7fe}}
@keyframes fk{0%,19%,21%,100%{opacity:1}20%{opacity:.35}}
.cd1{background:rgba(0,0,0,.88);backdrop-filter:none}
.cd2{background:transparent;box-shadow:none;border:2px solid var(--accent)}
.cd3{border-radius:0;border:2px solid var(--accent);box-shadow:8px 8px 0 var(--glow)}
.cd4{border-radius:46px}
.cd5{background:linear-gradient(#0b0b14,#0b0b14) padding-box,linear-gradient(135deg,var(--accent),var(--glow),#fff) border-box;border:2px solid transparent}
.cd6{box-shadow:0 0 80px var(--gl),0 0 0 1px var(--accent)}
.cd7{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.lk1 .lnk{background:linear-gradient(135deg,var(--accent),var(--glow));border-color:transparent;color:var(--on,#fff)}
.lk2 .lnk{background:transparent;border:2px solid var(--accent)}
.lk3 .lnk{border-radius:999px}
.lk4 .lnk{border-radius:0}
.lk5 .lnk{box-shadow:0 0 14px var(--gl),inset 0 0 14px var(--gl);border-color:var(--accent)}
.lk6 .lnk{background:none;border:0;border-bottom:2px solid var(--accent);border-radius:0}
.lk7 .lnk{background:#fff;color:#111;border-color:#fff}
.av1 .avatar{border-radius:20px}
.av2 .avatar{border-radius:0}
.av3 .avatar{border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.av4 .avatar{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.av5 .avatar{box-shadow:0 0 0 4px #000,0 0 0 7px var(--accent),0 0 40px var(--glow)}
.av6 .avatar{border-radius:30% 70% 70% 30%/30% 30% 70% 70%}
.av7 .avatar{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}

.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 0}
.bd{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--ln);background:rgba(255,255,255,.05)}
.lnk{--bc:var(--accent)}
.lnk:hover{border-color:var(--bc);box-shadow:0 0 22px -2px var(--bc)}
button.mute{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;width:46px;height:46px;padding:0;border-radius:50%;font-size:20px}
.toprow{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:800}
.toprow:hover{background:rgba(255,255,255,.07)}
.toprow small{color:var(--muted);font-weight:500;font-size:14px}
.glass h2.tp{margin:0 0 8px;font-size:22px}

.glass.profile{padding:0;overflow:hidden}
.banner{height:140px;background:linear-gradient(135deg,var(--glow),var(--accent) 60%,#ff5fa2);background-size:cover;background-position:center;position:relative}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(8,6,16,.9))}
.ring{position:relative;width:104px;height:104px;margin:-58px auto 12px;z-index:1}
.ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),#ff5fa2,var(--glow),var(--accent));animation:sp 5s linear infinite}
.ring .avatar{position:relative;margin:0;width:104px;height:104px;border:4px solid #0b0b14;font-size:44px}
@keyframes sp{to{transform:rotate(360deg)}}
.av1 .ring::before{border-radius:28px}.av6 .ring::before{border-radius:35%}
.av2 .ring::before,.av3 .ring::before,.av4 .ring::before{display:none}
.pbody{padding:0 22px 26px}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:16px 0 6px}
.soc{--bc:var(--accent);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;text-decoration:none;background:rgba(255,255,255,.06);border:1px solid var(--ln);transition:transform .15s,box-shadow .15s,background .15s}
.soc:hover{transform:translateY(-4px) scale(1.08);background:var(--bc);box-shadow:0 8px 26px -4px var(--bc)}
.links{margin-top:10px}

.av3 .avatar,.av4 .avatar{border:0}
.info{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 0}
.todo{margin-top:16px;padding:14px;border:1px dashed var(--ln);border-radius:14px}
.tdt{font-size:14px;color:var(--muted);margin-bottom:8px}
.todo .chip{margin:3px}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.bio{min-height:0}

.banner{background-image:linear-gradient(135deg,var(--b1),var(--b2))}
.lnk{background:var(--lb,rgba(0,0,0,.45))}
.tabs{display:flex;border-top:1px solid var(--ln);background:rgba(0,0,0,.35)}
button.tab{flex:1;border-radius:0;background:transparent;box-shadow:none;color:var(--muted);padding:14px 6px;font-size:14px;border-top:2px solid transparent;margin-top:-1px}
button.tab.on{color:var(--ink);border-top-color:var(--accent);background:rgba(255,255,255,.05)}
.tp{margin-top:6px}
.abt{white-space:pre-wrap;text-align:left;line-height:1.6;padding:8px 2px;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:14px;text-align:center}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gal div{aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;border:1px solid var(--ln)}
</style>
</head>

<script>
(function(){
var app=document.getElementById('app'),db=null,uid=null,live=false;

/* background particles */
(function(){var c=document.getElementById('fx'),x=c.getContext('2d'),ps=[],w,h;return;

(function t(){x.clearRect(0,0,w,h);ps.forEach(function(p){p.y-=p.v;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}x.fillStyle='rgba(190,160,255,'+p.a+')';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(t)})()})();

var FX=['None','Stars','Snow','Rain','Fireflies','Bubbles','Confetti','Hearts','Embers','Matrix'],fxT=1;
(function(){var c=document.getElementById('fx'),x=c.getContext('2d'),ps=[],w,h,rm=matchMedia('(prefers-reduced-motion:reduce)').matches,COL=['#ff5f6d','#ffc371','#47e0a0','#5fa8ff','#c47bff'];
function sz(){w=c.width=innerWidth;h=c.height=innerHeight}sz();addEventListener('resize',sz);
function mk(){var t=FX[fxT],p={x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,a:Math.random()*.6+.3,vx:0,vy:-.2,c:COL[Math.random()*5|0],ch:'1'};
if(t=='Snow'){p.vy=Math.random()*.8+.4;p.vx=Math.random()-.5;p.c='#fff'}
if(t=='Rain'){p.vy=Math.random()*6+8;p.r=Math.random()*14+8}
if(t=='Fireflies'){p.vx=Math.random()-.5;p.vy=Math.random()-.5;p.r=2.5;p.c='#ffee80'}
if(t=='Bubbles'){p.vy=-(Math.random()*.7+.3);p.r=Math.random()*10+4}
if(t=='Confetti'){p.vy=Math.random()*1.5+.8;p.vx=Math.random()-.5;p.r=Math.random()*6+4}
if(t=='Hearts'){p.vy=-(Math.random()*.8+.3);p.r=Math.random()*12+10}
if(t=='Embers'){p.vy=-(Math.random()*1.4+.6);p.vx=Math.random()-.5;p.c='#ff8a3d'}
if(t=='Matrix'){p.vy=Math.random()*2+1.5;p.c='#22ff66';p.ch=String.fromCharCode(0x30a0+(Math.random()*60|0))}
if(t=='Stars'){p.vy=-(Math.random()*.25+.05);p.c='#c8b4ff'}
return p}
function draw(){x.clearRect(0,0,w,h);var t=FX[fxT];
ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;
if(t=='Fireflies'){p.vx+=(Math.random()-.5)*.1;p.vy+=(Math.random()-.5)*.1}
if(p.y<-20||p.y>h+20||p.x<-20||p.x>w+20){var n=mk();p.x=Math.random()*w;p.y=n.vy<0?h+10:-10;p.vx=n.vx;p.vy=n.vy}
x.globalAlpha=p.a;x.fillStyle=x.strokeStyle=p.c;
if(t=='Rain'){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x,p.y+p.r);x.strokeStyle='#8ab4ff';x.stroke()}
else if(t=='Bubbles'){x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.strokeStyle='#9fd8ff';x.stroke()}
else if(t=='Confetti')x.fillRect(p.x,p.y,p.r,p.r*.6);
else if(t=='Hearts'){x.font=p.r+'px sans-serif';x.fillStyle='#ff6b9d';x.fillText('\u2665',p.x,p.y)}
else if(t=='Matrix'){x.font='14px monospace';x.fillText(p.ch,p.x,p.y)}
else{x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}});

        var s=await tmo(ref(name).get(),10000);if(s==='timeout')throw 0;if(name!==inp.value)return;

      }catch(e){st.className='status bad';st.textContent='Could not check this handle. Try again.'}
    },300);
  });
  btn.addEventListener('click',async function(){

      var s=await ref(name).get();

  });
}
